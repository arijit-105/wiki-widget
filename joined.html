<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body{
    margin:0;
    background:transparent;
    font-family:sans-serif;
    color:white;
    font-size:12px;
    font-weight:bold;
}
</style>
</head>
<body>

<span id="joined">Loading...</span>

<script>

function timeAgo(dateString) {

    const now = new Date();
    const then = new Date(dateString);

    let years = now.getFullYear() - then.getFullYear();
    let months = now.getMonth() - then.getMonth();

    if (months < 0) {
        years--;
        months += 12;
    }

    if (years > 0) {
        return years + "y " + months + "m";
    }

    return months + "m";
}

const params = new URLSearchParams(window.location.search);

const wiki = params.get('wiki');
const user = params.get('user');

const output = document.getElementById('joined');

if (!wiki || !user) {
    output.innerText = 'Missing params';
} else {

    const api =
        `https://${wiki}/w/api.php?action=query&list=usercontribs&ucuser=${encodeURIComponent(user)}&uclimit=1&ucdir=newer&format=json&origin=*`;

    fetch(api)
    .then(response => response.json())
    .then(data => {

        console.log(data);

        if (!data.query) {
            output.innerText = 'No query';
            return;
        }

        if (!data.query.usercontribs) {
            output.innerText = 'No contribs';
            return;
        }

        const contribs = data.query.usercontribs;

        if (contribs.length === 0) {
            output.innerText = 'Not active';
            return;
        }

        const firstEdit = contribs[0].timestamp;

        output.innerText =
            'Joined: ' + timeAgo(firstEdit);

    })
    .catch(error => {

        console.error(error);

        output.innerText = 'Fetch error';

    });

}

</script>

</body>
</html>
